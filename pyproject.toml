[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leema-sql"
version = "1.0.0"
description = "An agile, multi-engine Terminal User Interface (TUI) SQL IDE"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Tom Fynes"}
]
keywords = ["sql", "ide", "tui", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "textual>=0.47.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "keyring>=24.3.0",
    "sqlparse>=0.4.4",
    "pygments>=2.17.0",
    "duckdb>=0.9.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0.1",
    "pytest-asyncio>=0.21.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1.0"]
snowflake = ["snowflake-connector-python>=3.6.0"]
mysql = ["mysql-connector-python>=8.2.0"]
mssql = ["pymssql>=2.2.0"]
trino = ["trino>=0.328.0"]
all = [
    "psycopg[binary]>=3.1.0",
    "mysql-connector-python>=8.2.0",
    "pymssql>=2.2.0",
    "trino>=0.328.0",
    "snowflake-connector-python>=3.6.0",
]

[project.scripts]
leema = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]